<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanzar asistente Agrak</title>
<style>
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: #f4f7f5; color: #0e1b17; }
  main { max-width: 520px; margin: 48px auto; padding: 0 16px; }
  h1 { color: #0f5c4a; font-size: 26px; margin-bottom: 4px; }
  p.sub { color: #6b7c75; margin-top: 0; }
  form { background: #fff; border: 1px solid #dfe7e3; border-radius: 12px; padding: 20px; display: grid; gap: 14px; }
  label { font-weight: 600; font-size: 14px; display: grid; gap: 6px; }
  input { font: inherit; padding: 10px 12px; border: 1px solid #c9d6d1; border-radius: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: 11px 16px; border-radius: 8px; border: 0; cursor: pointer; background: #0f5c4a; color: #fff; }
  button.alt { background: #e6efeb; color: #0f5c4a; }
  #out { margin-top: 16px; padding: 14px; border-radius: 10px; background: #fff; border: 1px solid #dfe7e3; display: none; white-space: pre-wrap; }
  #out.err { border-color: #e2a3a3; background: #fff6f6; }
</style>
</head>
<body>
<main>
  <h1>Asistente de demo Agrak</h1>
  <p class="sub">Envía el asistente a un Google Meet o ensáyalo en el navegador.</p>
  <form id="f">
    <label>Clave (APP_SECRET)<input id="token" type="password" autocomplete="current-password" required></label>
    <label>Link del Meet<input id="url" placeholder="https://meet.google.com/abc-defg-hij"></label>
    <div class="row">
      <button type="submit">Enviar al Meet</button>
      <button type="button" class="alt" id="preview">Ensayar en el navegador</button>
    </div>
  </form>
  <div id="out"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  try { $('token').value = localStorage.getItem('agrak_token') || ''; } catch {}
  const show = (msg, err) => { const o = $('out'); o.style.display = 'block'; o.className = err ? 'err' : ''; o.innerHTML = msg; };
  async function call(path, body) {
    const token = $('token').value.trim();
    try { localStorage.setItem('agrak_token', token); } catch {}
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-app-token': token }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
    return j;
  }
  $('f').onsubmit = async (e) => {
    e.preventDefault();
    const url = $('url').value.trim();
    if (!/^https:\/\/meet\.google\.com\//.test(url)) return show('Pega un link de Google Meet válido.', true);
    show('Enviando…');
    try {
      const j = await call('/api/sessions', { meeting_url: url });
      show(`✅ El asistente va en camino (sesión ${j.session}).\nAdmítelo en el Meet si queda en la sala de espera.`);
    } catch (err) { show('No se pudo enviar: ' + err.message, true); }
  };
  $('preview').onclick = async () => {
    try { const j = await call('/api/preview'); window.open(j.path, '_blank'); show('Ensayo abierto en otra pestaña.'); }
    catch (err) { show('No se pudo abrir el ensayo: ' + err.message, true); }
  };
</script>
</body>
</html>
